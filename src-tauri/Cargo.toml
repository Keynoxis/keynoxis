[package]
name = "keynoxis"
version = "0.1.0"
description = "Open-source hardware-backed SSH agent"
authors = ["Keynoxis contributors"]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/keynoxis/keynoxis"

[lib]
name = "keynoxis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
pkg-config = "0.3"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2.2"
ssh-key = { version = "0.6.7", features = ["crypto"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
thiserror = "2"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
libc = "0.2"
